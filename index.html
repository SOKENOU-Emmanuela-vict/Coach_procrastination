<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning OS</title>
    <link rel="manifest" href="data/manifest.json">
    <link rel="stylesheet" href="src/ui/styles/main.css">
</head>
<body>
    <div id="app-root">
        <h1 style="text-align: center;">Learning OS</h1>
        <p style="text-align: center;">Initialisation du noyau...</p>
    </div>
    
    <nav id="bottom-nav" style="display: none;">
        <button data-view="desktop" class="active">🏠 Bureau</button>
        <button data-view="calendar">📅 Agenda</button>
        <button data-view="academic">🎓 Académique</button>
        <button data-view="coach">🤖 Coach</button>
        <button data-view="planning">📋 Plan</button>
        <button data-view="program">📅 Prog</button>
        <button data-view="journal">📖 Journal</button>
        <button data-view="portfolio">🏆 Portf</button>
    </nav>
    <script>
        window.addEventListener('error', function(e) {
            const root = document.getElementById('app-root');
            if(root) root.innerHTML = '<p style="color:red; padding:20px;">Erreur globale : ' + e.message + '<br>Fichier : ' + e.filename + '</p>';
        });
        window.addEventListener('unhandledrejection', function(e) {
            const root = document.getElementById('app-root');
            if(root) root.innerHTML = '<p style="color:red; padding:20px;">Promesse rejetée : ' + e.reason + '</p>';
        });
        setTimeout(function() {
            const root = document.getElementById('app-root');
            if (root && root.innerHTML.includes('Initialisation du noyau')) {
                root.innerHTML += `
                <div style="background: #1a0b1c; border: 2px solid #ff9800; padding: 20px; border-radius: 10px; margin: 25px auto; max-width: 480px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                    <h3 style="color: #ff9800; margin-top: 0;">⚠️ Chargement en attente de GitHub Pages</h3>
                    <p style="color: #e0e0e0; font-size: 14px; line-height: 1.5;">Si l'application reste bloquée sur "Initialisation du noyau", c'est que GitHub Pages est encore en cours de synchronisation ou que votre navigateur a mis en cache un ancien fichier.</p>
                    <button onclick="localStorage.clear(); window.location.reload(true);" style="background: #00f2fe; color: #0f2027; font-weight: bold; border: none; padding: 12px 24px; border-radius: 20px; cursor: pointer; font-size: 15px; margin-top: 12px; box-shadow: 0 2px 8px rgba(0,242,254,0.4);">
                        🔄 Purger le cache et recharger
                    </button>
                </div>`;
            }
        }, 3500);
    </script>
    <script type="module">
        import { Bootstrap } from './src/core/Bootstrap.js?v=44';
        
        window.addEventListener('DOMContentLoaded', async () => {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('./sw.js');
                    console.log('Service Worker registered');
                } catch(e) {
                    console.error('Service Worker registration failed', e);
                }
            }

            try {
                await Bootstrap.init();
            } catch(e) {
                console.error(e);
                document.getElementById('app-root').innerHTML = '<p style="text-align:center;color:red;">Erreur critique au démarrage.</p>';
            }
        });
    </script>
</body>
</html>
