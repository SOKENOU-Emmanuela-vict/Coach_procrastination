<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning OS</title>
    <meta name="theme-color" content="#183d3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Learning OS">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="src/ui/styles/main.css?v=7">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <script src="vendor/gsap/gsap.min.js"></script>
</head>
<body>
    <div id="app-root">
        <h1 style="text-align: center;">Learning OS</h1>
        <p style="text-align: center;">Initialisation du noyau...</p>
    </div>

    <!-- MODAL GLOBAL EDITION ITEM (utilisé par Portfolio, Life, Academic, Langues) -->
    <div id="global-item-editor-modal" class="modal-backdrop" hidden>
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="global-modal-item-header" class="modal-title">Éditer l'élément</h3>
            </div>
            
            <input type="hidden" id="global-modal-item-id">
            
            <div style="margin-top:16px; margin-bottom:12px;">
                <label class="form-label" for="global-modal-item-type-select">Type</label>
                <select id="global-modal-item-type-select" class="form-select" disabled>
                    <option value="project">Projet</option>
                    <option value="book">Livre</option>
                    <option value="task">Tâche</option>
                    <option value="habit">Habitude</option>
                    <option value="goal">Objectif</option>
                    <option value="skill">Langue / Skill</option>
                    <option value="subject">Matière Académique</option>
                    <option value="assessment">Évaluation Académique</option>
                </select>
            </div>

            <div style="margin-bottom:12px;">
                <label class="form-label" for="global-modal-item-title">Titre / Nom</label>
                <input type="text" id="global-modal-item-title" class="form-input">
            </div>

            <div style="margin-bottom:12px;">
                <label class="form-label" for="global-modal-item-domain">Domaine</label>
                <select id="global-modal-item-domain" class="form-select">
                    <option value="ecole">École</option>
                    <option value="langue">Langues</option>
                    <option value="fitness">Fitness / Bien-être</option>
                    <option value="lecture">Lecture</option>
                    <option value="projet">Projet</option>
                    <option value="perso">Personnel</option>
                </select>
            </div>

            <div style="display:flex; gap:12px; margin-bottom:12px;">
                <div style="flex:1;">
                    <label class="form-label" for="global-modal-item-dueDate">Échéance (Optionnel)</label>
                    <input type="date" id="global-modal-item-dueDate" class="form-input">
                </div>
                <div style="flex:1;">
                    <label class="form-label" for="global-modal-item-duration">Durée (min)</label>
                    <input type="number" id="global-modal-item-duration" class="form-input">
                </div>
            </div>

            <div style="margin-bottom:12px;">
                <label class="form-label" for="global-modal-item-priority">Importance</label>
                <select id="global-modal-item-priority" class="form-select">
                    <option value="low">Basse</option>
                    <option value="medium">Moyenne</option>
                    <option value="high">Haute</option>
                </select>
            </div>

            <div style="margin-bottom:20px;">
                <label class="form-label" for="global-modal-item-target">Cible (pages, séances, score max...)</label>
                <input type="number" step="any" id="global-modal-item-target" class="form-input">
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button type="button" id="global-btn-modal-cancel" class="btn btn-ghost">Annuler</button>
                <button type="button" id="global-btn-modal-save" class="btn btn-primary">Sauvegarder</button>
            </div>
        </div>
    </div>
    
    
    <!-- MODAL MON PROFIL -->
    <div id="user-profile-modal" class="modal-backdrop" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
            <div class="modal-header">
                <h3 id="profile-modal-title" class="modal-title"><i class="bi bi-person-circle"></i> Mon profil</h3>
                <button type="button" id="btn-profile-modal-close" class="btn btn-ghost btn-sm" aria-label="Fermer">✕</button>
            </div>
            <div class="modal-body">
                <div>
                    <label class="form-label" for="profile-modal-firstname">Prénom <span class="text-danger">*</span></label>
                    <input type="text" id="profile-modal-firstname" class="form-input" required placeholder="Ex. Emmanuela" autocomplete="given-name">
                </div>
                <div>
                    <label class="form-label" for="profile-modal-lastname">Nom affiché (optionnel)</label>
                    <input type="text" id="profile-modal-lastname" class="form-input" placeholder="Ex. Sokenou" autocomplete="family-name">
                </div>
                <div>
                    <label class="form-label" for="profile-modal-formation">Filière / Niveau (optionnel)</label>
                    <input type="text" id="profile-modal-formation" class="form-input" placeholder="Ex. L2 Informatique">
                </div>
                <div>
                    <label class="form-label" for="profile-modal-photo">Photo de profil (optionnelle, max 256 px)</label>
                    <input type="file" id="profile-modal-photo" class="form-input" accept="image/*">
                    <div class="profile-photo-actions">
                        <div id="profile-modal-preview-wrap" class="profile-photo-preview">
                            <span id="profile-modal-initial-preview" class="profile-initial-preview">É</span>
                            <img id="profile-modal-preview" class="profile-avatar-img" alt="Aperçu photo" hidden>
                        </div>
                        <button type="button" id="btn-profile-remove-photo" class="btn btn-ghost btn-sm" hidden><i class="bi bi-trash"></i> Supprimer la photo</button>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-profile-modal-cancel" class="btn btn-ghost">Annuler</button>
                <button type="button" id="btn-profile-modal-save" class="btn btn-primary">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- La navigation principale se fait via DesktopView.js désormais -->
    <script>
        window.addEventListener('error', function(e) {
            const root = document.getElementById('app-root');
            if(root) root.innerHTML = '<p style="color:red; padding:20px;">Erreur globale : ' + e.message + '<br>Fichier : ' + e.filename + '</p>';
        });
        window.addEventListener('unhandledrejection', function(e) {
            const root = document.getElementById('app-root');
            if(root) root.innerHTML = '<p style="color:red; padding:20px;">Promesse rejetée : ' + e.reason + '</p>';
        });

        // Supprimer toutes les données au chargement
        // localStorage.clear();
        // sessionStorage.clear();
        
        // Supprimer toutes les bases IndexedDB
        async function clearAllDatabases() {
            const dbs = await window.indexedDB.databases();
            dbs.forEach(db => {
                window.indexedDB.deleteDatabase(db.name);
            });
        }
        // clearAllDatabases(); // Décommenter pour vider les DBs 
        
        // Pas de setTimeout de secours ici
    </script>
    <script type="module">
        import { Bootstrap } from './src/core/Bootstrap.js?v=57';
        
        window.addEventListener('DOMContentLoaded', async () => {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('./sw.js');
                    console.log('Service Worker registered');
                } catch(e) {
                    console.error('Service Worker registration failed', e);
                }
            }

            try {
                window.app = await Bootstrap.init();
            } catch(e) {
                console.error(e);
                document.getElementById('app-root').innerHTML = '<p style="text-align:center;color:red;">Erreur critique au démarrage.</p>';
            }
        });
    </script>
</body>
</html>
