<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Learning OS - Variante 4 : Le Carnet de Cours & Validation (Inspiré de Bootstrap bi-journal-check) -->
  <!-- Safe zone 80% (410x410 au centre) respectée pour Android maskable -->
  <rect width="512" height="512" rx="112" fill="#183d3d"/>
  
  <g transform="translate(64, 64) scale(24)" fill="none" stroke="#fbf9f4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Contour du carnet -->
    <rect x="3.5" y="1.5" width="10" height="13" rx="1.5" stroke-width="1.2" fill="#fbf9f4" fill-opacity="0.08"/>
    <!-- Reliure / reliure spirale à gauche -->
    <line x1="1.5" y1="4" x2="3.5" y2="4" stroke-width="1.2"/>
    <line x1="1.5" y1="7" x2="3.5" y2="7" stroke-width="1.2"/>
    <line x1="1.5" y1="10" x2="3.5" y2="10" stroke-width="1.2"/>
    <line x1="1.5" y1="13" x2="3.5" y2="13" stroke-width="1.2"/>
    <!-- Coche nette au centre du carnet -->
    <path d="M5.5 8 L7.5 10 L11.5 5" fill="none" stroke="#fbf9f4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

